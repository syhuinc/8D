plugins {
    id 'com.android.application'
}

// The app ships the same web app as the website, copied in at build time
// from the repository root so there is only one copy of the code.
def webAssetsDir = layout.buildDirectory.dir('generated/web-assets').get().asFile
def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'app.js', 'vocals.js', 'style.css', 'icons/**', 'vendor/**'
    }
    into new File(webAssetsDir, 'www')
}
tasks.named('preBuild') { dependsOn copyWebAssets }

// Release signing is optional: pass -PreleaseKeystore=... (plus the
// password/alias properties below) to sign; otherwise the APK is unsigned.
def releaseKeystore = findProperty('releaseKeystore')

android {
    namespace 'io.github.syhuinc.eightd'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.syhuinc.eightd'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword findProperty('releaseKeystorePassword')
                keyAlias findProperty('releaseKeyAlias')
                keyPassword findProperty('releaseKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += [webAssetsDir]
    }
}
